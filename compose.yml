services:
  belot:
    build: .
    image: adiobella:local
    restart: unless-stopped
    ports:
      - "${BELOT_HOST_PORT:-1111}:8080"
    environment:
      SERVER_PORT: "8080"
      BELOT_ROOMS_DIRECTORY: /data/rooms
      BELOT_ROOMS_MAX_ROOMS: "${BELOT_ROOMS_MAX_ROOMS:-100}"
    volumes:
      - room-data:/data/rooms

volumes:
  room-data:
