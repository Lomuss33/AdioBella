<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font:14px/1.45 var(--font-sans,system-ui,sans-serif)}
.caption{margin:0 0 16px;color:var(--muted-foreground);font-size:12px}.layouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}figure{margin:0;min-width:0}figcaption{font-weight:650;margin-bottom:9px}.stage{height:320px;padding:16px;border-radius:var(--radius,10px);background:var(--card);color:var(--card-foreground);display:flex;flex-direction:column;gap:5px}.strip,.teams,.seats,.footer{display:flex;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:11px;line-height:1.2}.strip{min-height:25px;background:var(--secondary);color:var(--secondary-foreground)}.teams{min-height:39px;align-items:stretch}.teams span{flex:1;padding:5px 2px;background:var(--secondary);color:var(--secondary-foreground)}.seats{min-height:24px;color:var(--muted-foreground)}.play{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:4px}.trick{position:relative;height:112px;min-height:112px;width:132px;max-width:100%;margin:auto}.playing{position:absolute;width:29px;height:43px;border:1px solid var(--border);border-radius:3px;background:var(--popover);color:var(--popover-foreground);font-size:11px;display:grid;place-items:center}.n{top:0;left:calc(50% - 14.5px)}.s{bottom:0;left:calc(50% - 14.5px)}.w{left:0;top:34px}.e{right:0;top:34px}.points{font-size:11px;text-align:center;color:var(--muted-foreground)}.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-content:center;gap:3px;margin-top:7px}.hand i{font-style:normal;display:grid;place-items:center;height:27px;background:var(--accent-surface);color:var(--accent-surface-foreground);border-radius:2px;font-size:11px}.footer{min-height:22px;margin-top:3px;color:var(--muted-foreground)}.desktop .strip{min-height:36px;font-size:10px}.desktop .teams{display:none}.desktop .hand{grid-template-columns:repeat(8,minmax(0,1fr))}.desktop .hand i{height:37px}.desktop .seats{justify-content:space-between}.desktop .trick{height:143px;min-height:143px}.desktop .playing{width:34px;height:49px}.desktop .n,.desktop .s{left:calc(50% - 17px)}.desktop .w,.desktop .e{top:47px}.note{margin:10px 0 0;color:var(--muted-foreground);font-size:12px}.landscape .strip{min-height:32px}.landscape .main{display:flex;gap:8px;flex:1;align-items:center;min-height:0}.landscape .play{width:55%;flex:none}.landscape .trick{height:116px;min-height:116px}.landscape .playing{width:22px;height:34px}.landscape .n,.landscape .s{left:calc(50% - 11px)}.landscape .w,.landscape .e{top:41px}.landscape .right{flex:1;min-width:0}.landscape .hand{grid-template-columns:repeat(2,minmax(0,1fr))}.landscape .hand i{height:25px}.landscape .seats{font-size:10px}.landscape .right .footer{font-size:10px}.priority{margin:20px 0 0;font-size:13px}.priority strong{color:var(--foreground)}
@media(max-width:600px){.layouts{grid-template-columns:1fr}.stage{height:300px;max-width:340px;margin:auto}.desktop .stage{max-width:none;height:300px}.landscape .stage{max-width:none;height:230px}.landscape .hand{grid-template-columns:repeat(4,minmax(0,1fr))}.landscape .hand i{height:40px}.landscape .right{min-width:110px}.trick{max-width:135px}.note{max-width:340px}.desktop .note,.landscape .note{max-width:none}}
.landscape .hand{grid-template-columns:repeat(4,minmax(0,1fr))}
.phone .stage,.desktop .stage{height:400px}.phone .play{min-height:140px}.desktop .play{min-height:173px}
</style></head><body>
<p class="caption">Proposed space allocation · schematic, not measured card sizes</p>
<div class="layouts">
<figure class="phone"><figcaption>Phone portrait</figcaption><div class="stage"><div class="strip">Compact match strip ›</div><div class="teams"><span>Opponents<br>melds · points · wins</span><span>Your team<br>wins · points · melds</span></div><div class="seats">West · North · East</div><div class="play"><div class="trick" role="img" aria-label="Four played cards in a clear area below the seats"><span class="playing n">N</span><span class="playing s">S</span><span class="playing w">W</span><span class="playing e">E</span></div><div class="points">Points lane</div></div><div class="hand" aria-label="Eight hand cards in two rows"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i></div><div class="footer">Player · status · controls</div></div><p class="note">Compare 8×1 and 4×2. Choose the larger combined fit.</p></figure>
<figure class="desktop"><figcaption>Desktop / tablet</figcaption><div class="stage"><div class="strip">Opponents | Match › | Your team</div><div class="seats"><span>West</span><span>North</span><span>East</span></div><div class="play"><div class="trick" role="img" aria-label="Four played cards with reserved vertical clearance"><span class="playing n">N</span><span class="playing s">S</span><span class="playing w">W</span><span class="playing e">E</span></div><div class="points">Points lane</div></div><div class="hand" aria-label="Eight hand cards in one row"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i></div><div class="footer">Player · status · controls</div></div><p class="note">A shallow header leaves room for a larger trick and one hand row.</p></figure>
<figure class="landscape"><figcaption>Short landscape</figcaption><div class="stage"><div class="strip">Compact scores + match ›</div><div class="main"><div class="play"><div class="seats">W · N · E</div><div class="trick" role="img" aria-label="Played cards on the left, separated from the hand"><span class="playing n">N</span><span class="playing s">S</span><span class="playing w">W</span><span class="playing e">E</span></div><div class="points">Points lane</div></div><div class="right"><div class="hand" aria-label="Eight hand cards, a four by two grid at landscape width"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i></div><div class="footer">Player<br>status / controls</div></div></div></div><p class="note">Use width for a side hand when this beats the stacked layout.</p></figure>
</div><p class="priority"><strong>First priority:</strong> compact the match strip and end each score panel at its stats, with <strong>0 extra bottom space</strong>.</p>
<script>
const collisions=[];for(const f of document.querySelectorAll('figure')){for(const c of f.querySelectorAll('.playing')){const a=c.getBoundingClientRect();for(const e of f.querySelectorAll('.seats,.hand,.footer,.strip,.teams')){const b=e.getBoundingClientRect();if(Math.min(a.right,b.right)>Math.max(a.left,b.left)&&Math.min(a.bottom,b.bottom)>Math.max(a.top,b.top))collisions.push(f.className+': '+c.textContent+' / '+e.className)}}}console.log(JSON.stringify({cardCollisions:collisions,horizontalOverflow:document.documentElement.scrollWidth>innerWidth}));
</script></body></html>
